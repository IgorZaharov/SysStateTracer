name: repackage

# Moves an existing release's SysStateTracer.exe into SysStateTracer.zip (as the release workflow publishes
# since 1.1.0): the exe is checked against its published SHA-256, zipped unchanged and uploaded with the
# zip's SHA-256; the bare exe and its checksum are then removed. Optionally Manual.pdf is replaced by the
# one CI last built (the "ui-preview" pre-release), e.g. when only the manual's download chapter changed.
# Started by hand: Actions -> repackage -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.1.0'
        required: true
      manual_from_ui_preview:
        description: 'Also replace Manual.pdf with the one on the ui-preview pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  repackage:
    runs-on: windows-latest
    steps:
      - name: Zip the release's exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = '${{ github.event.inputs.tag }}'
          New-Item -ItemType Directory work, dist | Out-Null
          gh release download $tag --pattern 'SysStateTracer.exe' --pattern 'SysStateTracer.exe.sha256' --dir work
          if ($LASTEXITCODE -ne 0) { Write-Error "$tag has no SysStateTracer.exe to repackage"; exit 1 }
          $expected = ((Get-Content work/SysStateTracer.exe.sha256 -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $exeHash = (Get-FileHash work/SysStateTracer.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($exeHash -ne $expected) { Write-Error "SysStateTracer.exe does not match its published SHA-256"; exit 1 }
          Compress-Archive -Path work/SysStateTracer.exe -DestinationPath dist/SysStateTracer.zip -CompressionLevel Optimal
          $hash = (Get-FileHash dist/SysStateTracer.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  SysStateTracer.zip" | Set-Content dist/SysStateTracer.zip.sha256 -Encoding ascii -NoNewline
          $files = @('dist/SysStateTracer.zip', 'dist/SysStateTracer.zip.sha256')
          if ('${{ github.event.inputs.manual_from_ui_preview }}' -eq 'true') {
            gh release download ui-preview --pattern 'Manual.pdf' --dir dist
            if ($LASTEXITCODE -ne 0) { Write-Error 'No Manual.pdf on ui-preview'; exit 1 }
            $files += 'dist/Manual.pdf'
          }

          gh release upload $tag @files --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }
          gh release delete-asset $tag SysStateTracer.exe --yes
          gh release delete-asset $tag SysStateTracer.exe.sha256 --yes
          Write-Host "::notice title=Repackaged::$tag now has SysStateTracer.zip (SHA-256 $hash; exe $exeHash)"
          "zip=$hash" | Add-Content $env:GITHUB_STEP_SUMMARY
          "exe=$exeHash" | Add-Content $env:GITHUB_STEP_SUMMARY
