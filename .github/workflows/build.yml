name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # the "bench" pre-release
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the version carries the commit hash

      - name: Set up .NET SDK (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Each dotnet step runs through run.ps1, which turns errors into annotations on failure
      - name: Restore
        shell: pwsh
        run: .github/scripts/run.ps1 dotnet restore SysStateTracer.slnx

      - name: Build
        shell: pwsh
        run: .github/scripts/run.ps1 dotnet build SysStateTracer.slnx -c Release --no-restore

      - name: Test
        shell: pwsh
        env:
          SYSSTATETRACER_SCREENSHOTS: ${{ github.workspace }}\screenshots   # UI tests save every window in both themes
        run: .github/scripts/run.ps1 dotnet test SysStateTracer.slnx -c Release --no-build --logger trx --results-directory TestResults --blame-hang-timeout 10m

      # Window screenshots for review without a Windows PC, kept on the "ui-preview" pre-release
      - name: Update "ui-preview" pre-release
        if: always() && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem screenshots -Filter *.png -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) { Write-Host '::warning title=Screenshots::No screenshots were saved'; exit 0 }
          gh release view ui-preview *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create ui-preview --prerelease --target $env:GITHUB_SHA --title "UI preview" --notes "Screenshots of every window in the light and dark theme, saved by the UI tests. Updated by CI on every push to main."
          }
          gh release upload ui-preview $files.FullName --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "::notice title=Screenshots::$($files.Count) screenshots uploaded to the ui-preview pre-release"

      # Measurements printed by tests (memory, timings) become notices on the run page
      - name: Report test measurements
        if: always()
        shell: pwsh
        run: .github/scripts/report-tests.ps1

      - name: Publish single-file exe
        shell: pwsh
        run: .github/scripts/run.ps1 dotnet publish src/SysStateTracer/SysStateTracer.csproj -c Release -o publish

      - name: Upload SysStateTracer.exe
        uses: actions/upload-artifact@v4
        with:
          name: SysStateTracer-${{ github.sha }}
          path: publish/
          if-no-files-found: error

      # Plan Step 5: the publish folder must hold SysStateTracer.exe and nothing else
      - name: Check single-file output
        shell: pwsh
        run: |
          $files = Get-ChildItem publish -File
          $exe = Get-Item publish/SysStateTracer.exe
          $sizeMb = [math]::Round($exe.Length / 1MB, 1)
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash

          "### SysStateTracer.exe" >> $env:GITHUB_STEP_SUMMARY
          "| Item | Value |" >> $env:GITHUB_STEP_SUMMARY
          "| --- | --- |" >> $env:GITHUB_STEP_SUMMARY
          "| Size | $sizeMb MB |" >> $env:GITHUB_STEP_SUMMARY
          "| SHA-256 | ``$hash`` |" >> $env:GITHUB_STEP_SUMMARY
          "| Files in publish folder | $($files.Name -join ', ') |" >> $env:GITHUB_STEP_SUMMARY

          $extra = $files | Where-Object { $_.Name -ne 'SysStateTracer.exe' }
          if ($extra) {
            Write-Error "Publish folder must contain only SysStateTracer.exe; also found: $($extra.Name -join ', ')"
            exit 1
          }

      # Plan Step 39: the published exe answers on the command line (output, exit codes)
      - name: Command-line smoke test
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'cli'
          New-Item -ItemType Directory $dir -Force | Out-Null
          Copy-Item publish/SysStateTracer.exe $dir
          $exe = Join-Path $dir 'SysStateTracer.exe'
          function Invoke-Cli([string]$arguments) {
            $out = Join-Path $dir 'out.txt'
            $p = Start-Process $exe -ArgumentList $arguments -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out
            [pscustomobject]@{ Code = $p.ExitCode; Text = (Get-Content $out -Raw) }
          }
          $failed = $false
          $help = Invoke-Cli '/?'
          if ($help.Code -ne 0 -or $help.Text -notmatch 'Examples:' -or $help.Text -notmatch [regex]::Escape('https://github.com/IgorZaharov/SysStateTracer')) {
            Write-Host "::error title=CLI /?::exit $($help.Code); output: $(($help.Text -split "`r?`n" | Select-Object -First 5) -join ' | ')"
            $failed = $true
          }
          $expected = @{ '/no-such-switch' = 1; '/rename-snap "only one name"' = 1; '/delete-snap "No such snapshot"' = 2; '/compare-snap' = 2 }
          foreach ($case in $expected.GetEnumerator()) {
            $r = Invoke-Cli $case.Key
            if ($r.Code -ne $case.Value) {
              Write-Host "::error title=CLI $($case.Key)::exit $($r.Code), expected $($case.Value): $($r.Text)"
              $failed = $true
            }
          }
          $help.Text | Set-Content (Join-Path $env:RUNNER_TEMP 'help.txt') -Encoding utf8
          $lines = ($help.Text -split "`r?`n").Count
          Write-Host "::notice title=Command line::/? printed $lines lines; exit codes for wrong arguments and missing snapshots as expected"
          "### SysStateTracer.exe /?" >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          $help.Text >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          if ($failed) { exit 1 }

      # F8: Manual.pdf from this build's screenshots and /? text
      - name: Build Manual.pdf
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pip = python -m pip install --quiet --disable-pip-version-check reportlab pillow 2>&1
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=Manual.pdf::pip install failed: $((@($pip) | Select-Object -Last 4) -join ' | ')"; exit 1 }
          # The first non-empty line is "SysStateTracer <version>" (a console gets a blank line first)
          $version = ((Get-Content (Join-Path $env:RUNNER_TEMP 'help.txt') | Where-Object { $_.Trim() } | Select-Object -First 1) -split ' ')[1]
          $out = python tools/manual/make_manual.py --screens screenshots --help-text (Join-Path $env:RUNNER_TEMP 'help.txt') --version $version --out Manual.pdf 2>&1
          $out | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=Manual.pdf::$((@($out) | Select-Object -Last 6) -join ' | ')"; exit 1 }
          if ('${{ github.event_name }}' -eq 'push') {
            gh release upload ui-preview Manual.pdf --clobber
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          Write-Host "::notice title=Manual::Manual.pdf built ($([math]::Round((Get-Item Manual.pdf).Length / 1MB, 1)) MB) and put on the ui-preview pre-release"

      - name: Upload Manual.pdf
        uses: actions/upload-artifact@v4
        with:
          name: Manual-${{ github.sha }}
          path: Manual.pdf
          if-no-files-found: error

      # SysStateTracer.Bench.exe for measuring on real PCs (docs/benchmarks.md), kept on the "bench" pre-release
      - name: Publish benchmark tool
        if: github.event_name == 'push'
        shell: pwsh
        # Called directly: passing "-p:Name=value" through a script splits it at the colon
        run: |
          dotnet publish tests/SysStateTracer.Benchmarks/SysStateTracer.Benchmarks.csproj -c Release -r win-x64 --self-contained '-p:PublishSingleFile=true' '-p:IncludeNativeLibrariesForSelfExtract=true' '-p:EnableCompressionInSingleFile=true' -o bench
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Update "bench" pre-release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view bench *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create bench --prerelease --target $env:GITHUB_SHA --title "Benchmark tool" --notes "SysStateTracer.Bench.exe: double-click it (administrator rights needed) to measure snapshot speed on drive C:. Results are saved beside the exe. Updated by CI on every push to main."
          }
          gh release upload bench bench/SysStateTracer.Bench.exe --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore

  # Plan Step 55: the published exe on clean runners of two Windows generations
  clean-os:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Download SysStateTracer.exe
        uses: actions/download-artifact@v4
        with:
          name: SysStateTracer-${{ github.sha }}
          path: exe

      - name: Snapshot, change, snapshot, compare, export
        shell: pwsh
        run: .github/scripts/smoke.ps1 -Exe exe/SysStateTracer.exe
